career-profile:
  title: Career Profile
  summary: |
    25+ years of software engineering experience operating with the scope of a Technical Software Architect. Currently at KVK driving cross-team modernisation strategies, framework migrations, and security architecture.

    "Every line of code that doesn't exist is correct!"

    Specialised in bridging enterprise software development with automated architectural governance (ArchUnit, OpenRewrite, spec-driven AI workflows). Experienced in driving business-unit-wide technical initiatives, mentoring engineers, and presenting architectural patterns internally and at industry conferences.

    When not at work, I cook, travel, and enjoy learning new things by tinkering with mechanical keyboards, embedded systems, and e-waste in my home lab.

    Currently interested in: HID, eBPF, HID-eBPF, M5Stack, Cilium, and k0s.
    
    I live in Deventer, the Netherlands, and commute to work 1 day a week in Utrecht.

experiences:
  - role: Senior Software Engineer
    time: 2022 - Present
    company: KVK, Utrecht, the Netherlands
    details: |
      Operating as a senior software engineer for core platform modernisation initiatives:

      Architecture & Enterprise Modernisation:
        - Designed and executed a large-scale, spec-driven AI migration strategy for Spring Boot 3.5 to 4.1, establishing automated governance via OpenRewrite, ArchUnit, Pitest, and JaCoCo across standalone repositories.
        - Architected the core library migration from legacy Elasticsearch 7.x REST clients to modern fluent elasticsearch-java 8.x and up.
        - Defined custom and observability standards using Micrometer and Elastic Observability over multiple applications.
        - Managed HTTP routing, Istio service mesh, and Kubernetes platform configurations.

      Security & Technical Governance:
        - Security Champion leading threat modelling for our team.
        - Core member in the Java Guild, facilitating developers.

  - role: Senior / Research Engineer
    time: 2015 - 2022
    company: Innovalor (later Inverid, now part of Signicat), Enschede, the Netherlands
    details: |
      Architectural Lead for identity verification platforms and cloud logging infrastructure:
        - Designed and deployed enterprise Elastic stack, Grafana, and Prometheus monitoring infrastructure using custom Ansible role collections and Dockerised pipelines.
        - Architected the high-throughput data mining pipeline for ReadID (DNB ID Solutions) and engineered passport chip data anonymisation libraries.
        - Spearheaded identity verification service integrations (Azure Functions, OData, C#) and automated testing workflows (JUnit 5, mutation testing).

  - role: Software Engineer
    time: 2009 - 2015
    company: Centric, Deventer, the Netherlands
    details: |
      Systems Architect for municipal document and case management platforms (Suite4DM):
        - Architected OData web service layers and integration testing frameworks (C#, MSTest, property-based testing).
        - Scaled legacy infrastructure performance to support 200+ concurrent enterprise users.
        - Led technical knowledge transfer on TypeScript, WCF, and StUF standards across Dutch and international teams.

  - role: Software Engineer
    time: 2007 - 2009
    company: IKM Engineering, Emmen, the Netherlands
    details: |
      Technical Lead driving corporate transition to .NET web architectures, project leading DotNetNuke systems, and engineering Python/Zope flood crisis management integrations.

  - role: Application Engineer
    time: 1999 - 2007
    company: Novay (formerly Telematica Instituut), Enschede, the Netherlands
    details: |
      Research Engineer prototyping enterprise systems, including presence visualisation (AJAX/X3D), Microsoft Research unified communication platforms (Lync precursor), and rail transit simulators for ProRail/NS.

  - role: Volunteer Citizen Participation Board Member
    company: Municipality of Deventer
    time: 2008 - 2009
    details: |
      Board member facilitating civic engagement and local solar energy adoption initiatives.

  - role: Student Assistant
    company: University of Twente
    time: 1995 - 1998
    details: |
      Assisted computer science lab courses in C++ programming and system simulation.

