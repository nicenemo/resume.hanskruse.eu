{% assign sidebar = site.data.data.sidebar %}
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ sidebar.name }}{% if sidebar.tagline %} | {{ sidebar.tagline }}{% endif %}</title>
<meta name="description" content="{{ site.description }}">
<meta name="author" content="{{ sidebar.name }}">
<link rel="canonical" href="{{ site.url }}/">
<meta name="theme-color" content="#0b0e14" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f6f7fb" media="(prefers-color-scheme: light)">
<link rel="icon" href="{{ '/favicon.svg' | relative_url }}" type="image/svg+xml" sizes="any">
<link rel="stylesheet" href="{{ '/style.css' | relative_url }}">
<link rel="stylesheet" href="{{ '/assets/css/resume.css' | relative_url }}">
<script src="{{ '/menu.js' | relative_url }}" defer></script>
</head>
