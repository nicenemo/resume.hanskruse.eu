{% assign education = site.data.data.education %}
{% if education %}
<section class="section educations-section" id="education">
  <h2>Education</h2>
  {% for graduation in education %}
  <article class="item">
    <header>
      <h3>{{ graduation.degree }}</h3>
      <span class="time">{{ graduation.time }}</span>
    </header>
    <p class="company">{{ graduation.university }}</p>
    {% if graduation.details %}
    <div class="details">
      {{ graduation.details | markdownify }}
    </div>
    {% endif %}
  </article>
  {% endfor %}
</section>
{% endif %}
